<script>const RULES_HTML="<h2>How to play (core rules)</h2>\n<ul><li><b>Setup:</b> shuffle your 30-card deck and draw 5. Player 1 goes first.</li>\n<li><b>Your turn:</b> take exactly 2 actions (repeats allowed): Maneuver, Scheme or Attack. Then discard down to 7 cards.</li>\n<li><b>Maneuver:</b> draw 1 card (mandatory), then move each of your fighters up to your move value. You may discard one card to add its BOOST to the movement. Pass through friendly fighters but not enemies; end on an empty space.</li>\n<li><b>Exhaustion:</b> if you must draw from an empty deck, each of your fighters takes 2 damage. The discard pile is not reshuffled.</li>\n<li><b>Scheme:</b> play a scheme card a fighter of yours can use, resolve it and discard it.</li>\n<li><b>Attack:</b> melee fighters target adjacent enemies; ranged fighters target adjacent enemies or any enemy in a shared zone. The attacker plays a card face down, the defender may play a defense face down, and both are revealed together.</li>\n<li><b>Combat order:</b> IMMEDIATELY effects \u2192 DURING COMBAT effects \u2192 damage (attack minus defense) \u2192 AFTER COMBAT effects (defender's first). The attacker wins if the attack itself dealt at least 1 damage.</li>\n<li><b>Defeat:</b> a sidekick at 0 health leaves the board. When a hero is defeated, that player loses.</li></ul>\n<h2>Using this page</h2>\n<ul><li>The page handles turns, actions, drawing, hidden hands, face-down reveals, damage and exhaustion. You resolve card text yourselves with the health buttons, <b>Free move</b>, <b>Draw 1</b>, the action +/\u2212 and the combat Mod buttons.</li>\n<li><b>Range rules: off</b> lets you target anyone (for Bullseye, Ms. Marvel, T. Rex and similar reach effects).</li>\n<li><b>+ Token</b> places a labeled token (fog, traps, items, doubloons\u2026). In Free move, tap a token twice to remove it.</li></ul>\n<h2>Set-specific rules</h2><p>Core rules apply to every set. Each hero&#x27;s main special ability is printed on their character card (needs deck data). Below are the extra rulebook mechanics that the app must code for.</p>\n<h3>Mechanics that appear across several sets</h3>\n<ul>\n<li><b>Sidekick summoning</b>: Sun Wukong (Clones, pay 1 dmg), Squirrel Girl (squirrels), Blackbeard (Sea Dogs), Pandora (Kakod\u00e6mons), Ancient Leshen (Wolves). Place an off-board token; if all are out, move one instead.</li>\n<li><b>Multi-hero fighters</b> (lose only when the last one falls): Raptors (3), Wayward Sisters (3), Cloak &amp; Dagger (2).</li>\n<li><b>Blind Boost</b>: reveal the top card of the deck, add its BOOST, then discard it. Not a draw, so no exhaustion; empty deck = 0. Used by Spike, Willow, Daredevil and Doctor Strange.</li>\n<li><b>Battlefield items</b> (3 scheme + 3 combat tokens placed randomly): Redemption Row, Hell&#x27;s Kitchen, Teen Spirit, Brains &amp; Brawn, For King and Country.</li>\n<li><b>Secret passages</b> (move between passage spaces for 1 movement; not adjacent otherwise): Baskerville Manor, King Solomon&#x27;s Tomb, White House.</li>\n<li><b>One-way paths</b>: Raptor Paddock, Kaer Morhen, Santa&#x27;s Workshop.</li>\n<li><b>Ongoing schemes</b> (stay face up, 1 per hero, end-of-turn check): Witcher sets.</li>\n<li><b>Large fighter</b>: T. Rex (2 spaces, in all zones of both, melee reach 2).</li>\n<li><b>Small fighters</b>: squirrels (can share and pass through spaces, up to 4 per space, shared damage).</li>\n<li><b>Bonus attacks</b>: an AFTER COMBAT second attack on the same defender; cancelled if the card&#x27;s effect is cancelled.</li>\n<li><b>Free actions</b>: don&#x27;t count toward the 2 actions and must be used immediately.</li>\n</ul>\n<h3>Per set</h3>\n<p><b>Battle of Legends Vol 1</b>: Sinbad (Porter), Medusa (3 Harpies), King Arthur (Merlin), Alice (Jabberwock + size token chosen at setup). No extra rules.</p>\n<p><b>Battle of Legends Vol 2</b>: Achilles (Patroclus), Bloody Mary, Sun Wukong (Clones: at turn start take 1 dmg to summon one adjacent), Yennenga (2 Archers at 2 hp; can split her damage onto Archers in her zone). Hanging Gardens high ground: +1 to an attack made from the arrow&#x27;s base space toward its tip.</p>\n<p><b>Battle of Legends Vol 3</b>: Blackbeard (doubloons and treasury; ransom effects; pay 1 doubloon for +1 action; loses 1 doubloon when he takes combat damage), Pandora (7-card misery stack revealed at turn start, push-your-luck; 3 feathers = stop and take damage equal to cards revealed), Loki (TRICK cards pass to the opponent&#x27;s hand; +1 move per TRICK in opponents&#x27; hands; TRICK boost = 0), Chupacabra (draw a card after attacking). Santa&#x27;s Workshop: conveyor belts move fighters 1 space at the end of each turn, plus one-way paths.</p>\n<p><b>Robin Hood vs Bigfoot</b>: Robin (4 Outlaws), Bigfoot (Jackalope). No extra rules.</p>\n<p><b>Cobble &amp; Fog</b>: Dracula (3 Sisters), Holmes (Watson), Jekyll &amp; Hyde (transform token), Invisible Man (3 fog tokens: +1 defense on fog, moves fog-to-fog as if adjacent). Baskerville Manor has secret passages.</p>\n<p><b>Jurassic Park \u2013 InGen vs Raptors</b>: Muldoon (3 InGen workers, 8 traps: place one in his zone at turn start; an enemy entering stops and takes 1 damage). Raptors are 3 heroes.</p>\n<p><b>Jurassic Park \u2013 Sattler vs T. Rex</b>: Sattler (Malcolm; insight tokens dropped on spaces a friendly fighter moves into, 5 max), T. Rex (large fighter).</p>\n<p><b>Buffy</b>: Buffy (choose Giles or Xander at setup and add that sidekick&#x27;s 5 cards; can move through enemies), Angel (Faith), Willow (Tara; turns into Dark Willow when either takes damage, reverts at end of turn if adjacent to Tara), Spike (Drusilla; 3 shadow tokens).</p>\n<p><b>Little Red vs Beowulf</b>: Little Red (Huntsman; Basket = top of her discard pile, holding knife, pelt or wolfsbane), Beowulf (Wiglaf; 1\u20133 Rage, +1 when damaged). Heorot has doors that can be opened or closed during a maneuver; a closed door blocks movement, attacks and adjacency, and splits zones.</p>\n<p><b>Houdini vs Genie</b>: Houdini (Bess; when boosting a maneuver he may be placed in any space; some cards give a bonus when discarded for a boost), Genie (at turn start, discard 1 card for +1 action). King Solomon&#x27;s Tomb has secret passages.</p>\n<p><b>Redemption Row</b>: Moon Knight (identity rotates at end of turn; Khonshu takes combat damage only), Ghost Rider (Hellfire 0\u20135; spend 1 for Hell Cycle: move 4, passes through enemies dealing 1 damage each), Luke Cage (Misty Knight; \u22122 combat damage taken). Battlefield items.</p>\n<p><b>Hell&#x27;s Kitchen</b>: Elektra (4 Hand ninjas; resurrects once with 9 hp, flips her card, reshuffles deck + discard), Daredevil (Blind Boost), Bullseye (ranged: own zone or up to 5 spaces). Battlefield items.</p>\n<p><b>Brains &amp; Brawn</b>: Doctor Strange (Wong; Dark Pact: take 1 damage to put the played card on the bottom of his deck and draw; Blind Boost), Spider-Man (attacker must announce the printed attack value first), She-Hulk (at turn start, discard a card to deal its boost as damage to a fighter in her zone). Battlefield items.</p>\n<p><b>Teen Spirit</b>: Squirrel Girl (8 squirrels, small fighters), Ms. Marvel (melee reach 2), Cloak &amp; Dagger (two heroes). Battlefield items.</p>\n<p><b>For King and Country</b>: Black Panther (Shuri; Vibranium Suit stores the opponent&#x27;s cards for boosting, draws when he boosts), Black Widow (Maria Hill; missions with requirements; starts with Moscow Protocol in hand + 5 cards), Winter Soldier (Brainwashed effects can&#x27;t be cancelled, except by A Boy Named Bucky). Battlefield items.</p>\n<p><b>Slings &amp; Arrows</b>: Wayward Sisters (3 heroes; cauldron and ingredient spells after attacking), Hamlet (R&amp;G; TO BE / NOT TO BE choice each turn), Titania (Oberon; 6 glamour cards, 1 face up), Shakespeare (3 Actors; iambic line of syllables, exactly 10 completes it).</p>\n<p><b>Witcher \u2013 Steel &amp; Silver</b>: Geralt (Dandelion; choose 1 Weapon, 1 Armor and 1 Potion gear card, 2 copies each), Ciri (Ihuarraquax; Source cards scale with Source cards in discard; 7+ = can&#x27;t be cancelled), Ancient Leshen (2 Wolves, summon). Ongoing schemes. Kaer Morhen has one-way paths.</p>\n<p><b>Witcher \u2013 Realms Fall</b>: Eredin (4 Red Riders; Enraged when all are defeated: +1 attack/defense, move 3), Yennefer/Triss (rivals: one is the hero at 14 hp, the other the sidekick at 6), Philippa (Dijkstra; draws up to 4 at end of turn). Ongoing schemes. Naglfar&#x27;s upper and lower decks are linked by icons.</p>\n<p><b>Sun&#x27;s Origin</b>: Oda Nobunaga (2 Honor Guard; flanking = 2+ of his fighters adjacent to an enemy), Tomoe Gozen (an opposing hero leaving her zone takes damage).</p>\n<p><b>Lee vs Ali</b>: Bruce Lee (recurs Jeet Kune Do cards), Muhammad Ali (stance flips after winning a combat as attacker; Butterfly = reach 2 + blue effects; Bee = +2 attack).</p>\n<p><b>Stars &amp; Stripes</b>: Washington (3 Spies; 4 ruse tokens), Rosie (Wendy; mech-suit upgrades in a fixed order), John Henry (10 track tokens; spaces with track cost no movement), Wyatt Earp (Doc Holliday; Showdown bonus after winning a combat). White House has secret passages.</p>\n<p><b>Tales to Amaze</b> (competitive): Jill Trent (Daisy; choose 1 of 2 gadgets each turn), Annie Christmas (Charlie; +2 attack when her health is below the defender&#x27;s), Nikola Tesla (2 coils: charge, discharge, and zap adjacent enemies when both are charged), Golden Bat (+2 attack if you didn&#x27;t maneuver). The co-op villain rules are separate.</p>\n<p><b>TMNT</b> (competitive): Mikey (April; 3-card hand, draws a card per attack or scheme), Donatello (Metalhead; inventions tucked under his card for permanent bonuses), Leonardo (Splinter; at turn start each may move any fighter 1 space), Raphael (Casey Jones; +1 action the first time he loses an attack each turn).</p>\n<p><b>Deadpool, Bruce Lee (solo)</b>: no extra rulebook rules; everything is on the character card.</p>\n<p><b>Hellboy</b>: rules not found online yet.</p>";</script>

const SEATS=['p1','p2'];

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function isObj(v){return v&&typeof v==='object'&&!Array.isArray(v);}
function deepMerge(t,p){for(const k in p){const v=p[k];if(isObj(v)&&isObj(t[k]))deepMerge(t[k],v);else t[k]=isObj(v)?clone(v):v;}return t;}

function lattice(name,pts,zones,starts,cut){
  const spaces=pts.map((p,i)=>({id:String(i+1),x:p[0],y:p[1],zones:zones[i]}));
  const edges=[];
  for(let i=0;i<spaces.length;i++)for(let j=i+1;j<spaces.length;j++){const a=spaces[i],b=spaces[j];
    if(Math.hypot(a.x-b.x,a.y-b.y)<90&&!cut.includes(a.id+'-'+b.id))edges.push([a.id,b.id]);}
  return {name,spaces,edges,starts};
}

};

// ---------- Deck import (tolerant) ----------
function pick(o,...ks){for(const k of ks){if(o&&o[k]!==undefined&&o[k]!==null&&o[k]!=='')return o[k];}return undefined;}
function normType(t){t=String(t||'').toLowerCase();if(t.startsWith('att'))return'attack';if(t.startsWith('def'))return'defense';if(t.startsWith('ver'))return'versatile';if(t.startsWith('sch'))return'scheme';return t||'scheme';}
function parseDeck(txt){
  txt=txt.trim();if(!txt)throw new Error('Paste a deck first.');
  if(txt[0]==='{'||txt[0]==='['){
    let j=JSON.parse(txt);if(Array.isArray(j))j={cards:j};if(j.deck&&!j.cards)j=j.deck;
    const h=j.hero||j.character||{};
    const hero={name:pick(h,'name','title')||j.name||'Hero',hp:+pick(h,'hp','health','startHealth','startingHealth')||15,move:+pick(h,'move','movement','moveValue')||2,
      ranged:/ranged/i.test(String(pick(h,'attackType','isRanged','ranged','type')??''))||pick(h,'isRanged','ranged')===true,
      ability:pick(h,'specialAbility','ability','specialAbilityText','text')||''};
    let sk=j.sidekick||(Array.isArray(j.sidekicks)?j.sidekicks[0]:null);
    const sidekick=sk&&pick(sk,'name','title')?{name:pick(sk,'name','title'),hp:+pick(sk,'hp','health')||1,count:+pick(sk,'quantity','count','qty')||1,
      ranged:/ranged/i.test(String(pick(sk,'attackType','isRanged','ranged')??''))||pick(sk,'isRanged','ranged')===true}:null;
    const cards=(j.cards||j.actionCards||[]).map(c=>{
      const parts=[];const b=pick(c,'basicText','text','effect','description');if(b)parts.push(b);
      const im=pick(c,'immediateText','immediately');if(im)parts.push('IMMEDIATELY: '+im);
      const du=pick(c,'duringText','duringBasicText','duringCombatText','during');if(du)parts.push('DURING COMBAT: '+du);
      const af=pick(c,'afterText','afterCombatText','after');if(af)parts.push('AFTER COMBAT: '+af);
      return {qty:+pick(c,'quantity','qty','count','copies')||1,name:pick(c,'title','name')||'Card',type:normType(pick(c,'type','cardType')),
        value:+pick(c,'value','attack','defense','val')||0,boost:+pick(c,'boost','boostValue')||0,
        fighter:String(pick(c,'characterName','fighter','usableBy','character')||'any'),text:parts.join('\n')};});
    if(!cards.length)throw new Error('No cards found in that JSON.');
    const ap=j.appearance||{};const col=pick(ap,'cardbackColour','cardbackColor','borderColour','borderColor','highlightColour','highlightColor');
    return {hero,sidekick,cards,color:typeof col==='string'&&/^#?[0-9a-f]{6}$/i.test(col)?(col[0]==='#'?col:'#'+col):null};
  }
  // text format
  const deck={hero:null,sidekick:null,cards:[]};
  for(let line of txt.split('\n')){line=line.trim();if(!line||line.startsWith('#'))continue;
    const f=line.replace(/^(HERO|SIDEKICK):/i,'').split('|').map(s=>s.trim());
    if(/^HERO:/i.test(line))deck.hero={name:f[0],hp:+f[1]||15,move:+f[2]||2,ranged:/ranged/i.test(f[3]||''),ability:f[4]||''};
    else if(/^SIDEKICK:/i.test(line))deck.sidekick={name:f[0],hp:+f[1]||1,count:+f[2]||1,ranged:/ranged/i.test(f[3]||'')};
    else{const m=f[0].match(/^(\d+)\s*x\s*(.+)$/i);deck.cards.push({qty:m?+m[1]:1,name:m?m[2]:f[0],type:normType(f[1]),value:+f[2]||0,boost:+f[3]||0,fighter:f[4]||'any',text:(f[5]||'').replace(/\\n/g,'\n')});}
  }
  if(!deck.hero)throw new Error('Missing a HERO: line.');if(!deck.cards.length)throw new Error('No card lines found.');
  return deck;
}
function expandDeck(def){const out=[];for(const c of def.cards)for(let i=0;i<(c.qty||1);i++)out.push({id:rid(),name:c.name,type:c.type,value:c.value,boost:c.boost,fighter:c.fighter,text:c.text,art:c.art||undefined,sym:c.sym||undefined,asDef:c.asDef||undefined,bb:c.bb||undefined});return out;}
function deckSize(def){return def.cards.reduce((a,c)=>a+(c.qty||1),0);}

// ---------- Generated art (original designs) + per-hero photo library ----------
const GEN={};
function heroSlug(n){return String(n||'hero').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60)||'hero';}
function shade(hex,amt){const h=hex.replace('#','');if(h.length!==6)return hex;const n=parseInt(h,16);let r=(n>>16)+amt,g=(n>>8&255)+amt,b=(n&255)+amt;
  r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b));return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);}
function initials(n){return String(n).split(/[\s&.-]+/).filter(Boolean).map(w=>w[0]).join('').slice(0,2).toUpperCase();}
function genArt(kind,name,color){const key=kind+'|'+name+'|'+color;if(GEN[key])return GEN[key];
  const c=document.createElement('canvas');c.width=c.height=240;const g=c.getContext('2d');let seed=0;for(const ch of name)seed=(seed*33+ch.charCodeAt(0))>>>0;
  const rnd=()=>{seed=(seed*1103515245+12345)>>>0;return (seed>>>8)/16777216;};
  const grd=g.createRadialGradient(120,100,10,120,120,170);grd.addColorStop(0,shade(color,50));grd.addColorStop(1,shade(color,-70));g.fillStyle=grd;g.fillRect(0,0,240,240);
  g.strokeStyle='rgba(255,255,255,.14)';g.lineWidth=2;
  if(kind==='back'){const sides=3+Math.floor(rnd()*4);for(let k=1;k<9;k++){g.beginPath();const rr=k*15,rot=rnd()*0.2+k*0.12;for(let i=0;i<=sides;i++){const a=rot+i*2*Math.PI/sides;const x=120+rr*Math.cos(a),y=120+rr*Math.sin(a);i?g.lineTo(x,y):g.moveTo(x,y);}g.stroke();}
    g.strokeStyle='rgba(255,236,190,.55)';g.lineWidth=5;g.strokeRect(10,10,220,220);g.lineWidth=1.5;g.strokeRect(20,20,200,200);}
  else{for(let k=0;k<14;k++){g.beginPath();g.arc(120,120,20+k*8,rnd()*6,rnd()*6+2);g.stroke();}}
  g.beginPath();g.arc(120,120,kind==='back'?62:84,0,2*Math.PI);g.fillStyle='rgba(8,10,16,.55)';g.fill();g.strokeStyle='rgba(255,236,190,.8)';g.lineWidth=4;g.stroke();
  g.fillStyle='#fff3d6';g.textAlign='center';g.textBaseline='middle';g.font=`800 ${kind==='back'?58:76}px system-ui,sans-serif`;g.fillText(initials(name),120,kind==='back'?116:122);
  if(kind==='back'){g.font='700 17px system-ui,sans-serif';g.fillText(String(name).toUpperCase().slice(0,18),120,208);}
  return GEN[key]=c.toDataURL('image/png');}

let reconciling=false;
function reconcile(){if(reconciling||!S.pub)return;reconciling=true;try{

    if((S.pub.status==='play')&&!pr.dealt&&pr.deck.length){const sc=(heroOf(s)||{}).startCard;if(sc){const i=pr.deck.findIndex(q=>q.name===sc);if(i>=0){pr.hand.push(pr.deck.splice(i,1)[0]);log(`${seatName(s)} starts with ${sc} in hand.`);}}shuffle(pr.deck);pr.dealt=true;S.ui.noFlash=true;drawCards(s,5);S.ui.noFlash=false;log(`${seatName(s)} shuffled and drew 5.`);}
    const c=S.pub.combat;if(!c)continue;
    if(c.atkReady&&c.defReady){
      if(s===c.attacker&&!c.atkCard&&pr.pending){pubUpdate({combat:{atkCard:gateCard(s,pr.pending),atkBoost:pr.pendingBoost||null}});}
      if(s===c.defender&&!c.defRevealed){pubUpdate({combat:{defCard:gateCard(s,pr.pending)||null,defRevealed:true}});}
    }
    if(c.stage==='done'){
      const flag=s===c.attacker?'cleanA':'cleanD';
      if(!c[flag]){if(pr.pending||pr.pendingBoost){const card=pr.pending,b=pr.pendingBoost;pr.pending=null;pr.pendingBoost=null;privSave(s);if(card&&card.toBottom){delete card.toBottom;pr.deck.push(card);privSave(s);log(`${seatName(s)} puts ${card.name} on the bottom of their deck.`);}else if(card&&card.toDeck){delete card.toDeck;pr.deck.push(card);shuffle(pr.deck);privSave(s);log(`${seatName(s)} shuffles ${card.name} into their deck.`);}else if(card&&card.toHand){delete card.toHand;pr.hand.push(card);privSave(s);log(`${seatName(s)} returns ${card.name} to their hand.`);}else if(card&&!card.virtual)discardCard(s,card);if(b)discardCard(s,b);}pubUpdate({combat:{[flag]:true}});}
    }
  }
  const c=S.pub.combat;if(c&&c.stage==='done'&&c.cleanA&&c.cleanD&&mySeats().includes(c.attacker)){pubUpdate({combat:null});checkDefeats();}
  if(!S.pub.combat&&S.pub.bonusAtk&&mySeats().includes(S.pub.bonusAtk.seat)&&!S.ui.fx)startBonus();
  manxomeCheck();draculaChecks();driveCombat();processReqs();sizeSetupCheck();fogSetupCheck();turnStartCheck();autoEndCheck();
}finally{reconciling=false;}}

function backHtml(seat,label){const th=themeOf(seat);return `<div class="cd back" style="--c:${th.color};${th.back?`background-image:url(${th.back})`:''}"><span>${esc(label||'Face down')}</span></div>`;}
function flashShow(title,cards,opts){opts=opts||{};const now=Date.now();const f=S.ui.flash;
  if(f&&f.title===title&&now-f.t<1500&&!opts.back)f.cards=f.cards.concat(cards);else S.ui.flash={title,cards:cards.slice(),back:opts.back||null,n:opts.n||0,t:now,drew:!!opts.drew};
  clearTimeout(S.ui.flashT);S.ui.flashT=setTimeout(()=>{S.ui.flash=null;if(S.pub)render();},opts.ms||2800);if(S.pub)render();}
function renderFlash(){const f=S.ui.flash;if(!f)return '';const n=f.back?f.n:f.cards.length;if(!n)return ''; const W=Math.min(innerWidth*0.94,900)-24,H=innerHeight*(f.drew?(innerHeight<560?0.3:0.2):(innerHeight<560?0.62:0.42));const w=Math.floor(Math.max(48,Math.min(f.drew?110:170,(W-8*(n-1))/n,H/1.397)));
  return `<div class="flash${f.drew?' drew':''}" style="--flw:${w}px"><h4>${esc(f.title)}</h4><div class="frow">${f.back?Array.from({length:n},()=>`<i class="fback" style="background-image:url(${esc(f.back)})"></i>`).join(''):f.cards.map(c=>cardHtml(c)).join('')}</div></div>`;}
function cardHtml(c,act,extra=''){if(!c)return '';const tcol={attack:'#ef4444',defense:'#3b82f6',versatile:'#a855f7',scheme:'#eab308'}[c.type]||'#888';
  if(c.art)return `<div class="cd art" ${act?`data-a="${act}" data-c="${c.id}"`:''} style="--t:${tcol}" title="${esc(c.name)}" ${extra}><img src="${esc(c.art)}" alt="${esc(c.name)} — ${esc(c.type)} ${c.type==='scheme'?'':esc(c.value)}, boost ${esc(c.boost)}. ${esc(c.text)}" loading="lazy" draggable="false"></div>`;
  return `<div class="cd" ${act?`data-a="${act}" data-c="${c.id}"`:''} style="--t:${tcol}" ${extra}>
   <div class="cdh"><span class="cdv">${c.type==='scheme'?'★':esc(c.value)}</span><span class="cdn">${esc(c.name)}</span></div>
   <div class="cdty">${esc(c.type)} · ${esc(c.fighter)}</div><div class="cdt">${esc(c.text).replace(/\n/g,'<br>')}</div>
   <div class="cdb">BOOST ${esc(c.boost)}</div></div>`;}

function renderCombat(){const c=S.pub.combat;if(!c)return '';const fs=fighters();const me=viewSeat();const a=fs[c.atkF],d=fs[c.defF];
  const mine=x=>mySeats().includes(x);let body='';
  if(!c.defReady){
    if(me===c.defender){const ok=handOf(me).some(x=>isDefCard(x)&&canUse(x,c.defF));
      body=`<p><b>${esc(a.name)}</b> is attacking <b>${esc(d.name)}</b> with a face-down card${c.atkHasBoost?' plus a face-down boost card':''}.</p>
      <div class="reveal">${backHtml(c.attacker,'Attack card')}${c.atkHasBoost?backHtml(c.attacker,'Boost card'):''}</div>
      ${c.spidey!=null?`<p><b>Spidey-Sense:</b> the attack card's printed value is <b>${c.spidey}</b>.</p>`:''}
      <p class="muted small">${ok?`Tap a defense or versatile card that ${esc(d.name)} can use, or:`:`You have no card ${esc(d.name)} can defend with.`}</p><button class="btn" data-a="nodef">Don't defend</button>`;}
    else body=`<p>Your face-down card is set. Waiting for ${esc(seatName(c.defender))} to choose a defense…</p><div class="reveal">${cardHtml(S.priv[me]&&S.priv[me].pending)}${backHtml(c.defender,'Defender choosing…')}</div>`;
  } else if(!c.atkCard||!c.defRevealed){body='<p>Revealing…</p>';}
  else{const r=combatCalc(c);const after=c.stage!=='choose';
    const atkV=after?c.atkVal:r.atk,defV=after?c.defVal:r.def,dmg=after?c.dmg:r.dmg;
    const boostChip=c.atkBoost?`<div class="boostchip">${(after?c.atkCancel:r.atkCancel)?'Boost discarded':'+'+c.atkBoost.boost+' boost'} · ${esc(c.atkBoost.name)}</div>`:'';
    const nsChip=c.nsBoost?`<div class="boostchip">+${c.nsBoost.boost} · ${esc(c.nsBoost.name)}</div>`:'';
    body=`<div class="reveal"><div><div class="muted small">${esc(a.name)} attacks</div>${cardHtml(c.atkCard)}${boostChip}${nsChip}</div>
      <div><div class="muted small">${esc(d.name)} defends</div>${c.defCard?cardHtml(c.defCard):'<div class="cd empty">No defense</div>'}</div></div>
      <div class="calc">Attack <b>${atkV}</b> vs defense <b>${defV}</b> → <b>${dmg}</b> damage to ${esc(r.redirect&&!after?fighters()[c.atkF].name:d.name)}${after?` · <b>${c.atkWon?'attacker':'defender'}</b> won`:''}
      ${r.notes.length&&!after?`<ul>${r.notes.map(n=>`<li>${esc(n)}</li>`).join('')}</ul>`:''}
      ${r.manual.length&&!after?`<div class="muted small">Not automated: ${r.manual.map(esc).join(' · ')}. Open Manual adjustments to apply with the Mod buttons.</div>`:''}</div>`;
    if(showManual()&&!after)body+=`<div class="mod">Attack mod <button data-a="mod" data-k="atkMod" data-d="-1">−</button><b>${c.atkMod>=0?'+':''}${c.atkMod}</b><button data-a="mod" data-k="atkMod" data-d="1">+</button>
      ${c.defCard?` Defense mod <button data-a="mod" data-k="defMod" data-d="-1">−</button><b>${c.defMod>=0?'+':''}${c.defMod}</b><button data-a="mod" data-k="defMod" data-d="1">+</button>`:''}
      <div class="tools" style="justify-content:center"><button class="mini" data-a="x_cancA">${c.manCancelA?'✓ ':''}Attack effects cancelled</button>${c.defCard?`<button class="mini" data-a="x_cancD">${c.manCancelD?'✓ ':''}Defense effects cancelled</button>`:''}</div></div>`;
    if(!after){if(mine(c.attacker)){
        if(r.selfBoost&&!c.nsBoost&&handOf(c.attacker).length)body+=`<button class="btn" data-a="x_nsboost">${esc(c.atkCard.name)}: boost this attack</button>`;
        body+=r.waiting?`<p class="muted">Waiting for a card effect to finish…</p>`:`<button class="btn pri" data-a="x_resolve">Deal ${dmg} damage to ${esc(r.redirect?fighters()[c.atkF].name:d.name)}</button>`;}
      else body+=`<p class="muted">Waiting for ${esc(seatName(c.attacker))} to resolve the combat…</p>`;}
    else if(c.stage==='after_def'||c.stage==='after_atk'){const seat=c.stage==='after_def'?c.defender:c.attacker;
      const stuck=mine(seat)&&c[c.stage==='after_def'?'runD':'runA']&&S.ui.stepKey!==c.id+':'+c.stage;
      body+=`<p class="muted">After combat: ${esc(seatName(seat))}'s ${seat===c.defender?'defense':'attack'} card${mine(seat)?' (follow the prompts above)':'…'}</p>${stuck?'<button class="btn" data-a="x_unstick">Continue</button>':''}`;}
    else body+='<p class="muted">Combat finished.</p>';}
  return `<div class="combat"><h3>⚔ Combat</h3>${body}</div>`;}

function needsBoard(){const m=S.ui.mode;if(m==='maneuver'||m==='attack'||m==='free')return true;const fx=S.ui.fx;return !!(fx&&['move','multi','space','pick','place','tok','revive'].includes(fx.kind));}

  return `<div class="wrap game${v3?' g3':''}">

function oppHand(seat){const n=+((mySeats().includes(seat)&&S.priv[seat])?S.priv[seat].hand.length:((S.pub.counts[seat]||{}).hand))||0;const th=themeOf(seat);
  const w=30,step=n>1?Math.min(w*0.62,(Math.min(window.innerWidth*0.5,360)-w)/(n-1)):0,spread=Math.min(5,28/Math.max(1,n));

const HERO_RULES={"Ghost Rider":["Ghost Rider starts with 5 Hellfire (max 5), shown on his playmat. Many cards spend or gain Hellfire.","Hell Cycle: when you maneuver you may spend 1 Hellfire. His move becomes 4 and he can ride through opposing fighters, dealing 1 damage to each one he passes (once each). You can't boost that maneuver."],"Luke Cage": ["Attacks deal 2 less combat damage to Luke (never below 0). Damage from card effects is NOT reduced.", "When defending, Luke wins the combat if he takes no damage — even if he didn't play a card."], "Moon Knight": ["He has 3 identities and starts as Moon Knight. At the end of each of your turns he changes: Moon Knight → Khonshu → Mr. Knight → Moon Knight…", "Moon Knight: at the start of your turn you may move him up to 2 spaces.", "Khonshu: +2 to his attacks, and he ignores all damage from card effects (only combat damage hurts him).", "Mr. Knight: +1 to his defense cards.", "His current identity is shown under his figure and on his character card."], "Dr. Sattler": ["Whenever Dr. Sattler or Dr. Malcolm MOVES (maneuver or a move effect), an insight token is placed in their new space. Being placed doesn't count.", "You have 5 insight tokens; once all 5 are out, nothing more is placed. Some cards remove all tokens to power big effects.", "Many cards count insight tokens on the board or let you place fighters on them."], "T. Rex": ["T. Rex is a LARGE fighter: her base fills 2 spaces (head and tail). Anything touching either space is adjacent to her.", "She can attack any fighter up to 2 spaces from either of her spaces, even over fighters in between.", "When she moves she can start from either end; the head moves and the tail follows into the space the head left.", "At the end of your turn, draw a card."], "Squirrel Girl": ["Start with no squirrels on the board. At the start of each turn, summon a squirrel next to Squirrel Girl (8 in the supply).", "Squirrels are SMALL: up to 4 share a space, they can share a space with another fighter and move through anyone.", "If one squirrel in a space takes damage, every squirrel in that space takes it."], "Cloak": ["You have TWO heroes, Cloak and Dagger. You only lose when both are defeated.", "Umbra: after you attack, if Cloak dealt 2+ combat damage, your opponent discards 1 card.", "Refraction: after you attack, if Dagger dealt 2+ combat damage, gain 1 action."], "Raptor": ["You have THREE heroes (the Raptors). You only lose when all three are defeated.", "Each Raptor adds +1 to its attack for every other Raptor adjacent to the defender."], "Robert Muldoon": ["At the start of your turn you may place a trap in an empty space in Muldoon's zone (8 traps).", "An opposing fighter that enters a trap space stops, takes 1 damage, and the trap goes back in the box. Whenever a trap returns to the box, you draw a card."], "Oda Nobunaga": ["Master Strategist: your other fighters in Oda's zone add +1 to their combat cards (not Oda himself).", "An opposing fighter is FLANKED when 2 or more of your fighters are adjacent to it — several cards get stronger against flanked fighters."], "Dr. Jill Trent": ["At the start of each turn, choose which gadget is active.", "Hypnoray Blaster: when Jill attacks with a lower printed value than the defense, add the BOOST of your opponent's top deck card.", "Ultrabiotic Tonic: when Jill attacks with a higher printed value than the defense, she recovers 1 health."], "Nikola Tesla": ["Tesla has 2 coils and starts with 1 charged. At the end of your turn, charge 1 coil.", "At the start of your turn, if both coils are charged, each opposing fighter next to Tesla takes 1 damage and may be pushed 1 space.", "Some cards let you DISCHARGE coils (⚡ or ⚡⚡) for bonus effects."], "Houdini": ["When Houdini maneuvers and BOOSTS, he may be placed in any empty space instead of moving (Bess moves normally).", "Cards with a BOOST bonus trigger that bonus whenever you boost with them."], "Winter Soldier": ["Effects on Winter Soldier's cards cannot be canceled.", "STAR effects can only be ignored by playing A Boy Named Bucky."], "Black Panther": ["Whenever you BOOST, draw 1 card.", "Some cards store your opponent's cards in your VIBRANIUM SUIT. Stored cards can only be used to boost, then go to your opponent's discard pile."], "Black Widow": ["Start with The Moscow Protocol in hand plus 5 cards.", "Her schemes are MISSIONS — each can only be played if its requirement is met. Missions may let you acquire a new mission from your deck."], "Elektra": ["The first time Elektra would be defeated, she and all of The Hand leave the board instead.", "At the start of your next turn she RESURRECTS at 9 health: shuffle your discard pile into your deck and place Elektra and The Hand back in different zones.", "Effects marked RESURRECTED only work after she has resurrected."], "Willow": ["When Willow or Tara takes damage, Willow becomes DARK WILLOW (some cards change).", "At the end of your turn, if Dark Willow is next to Tara, she turns back into Willow."], "Spike": ["At the start of your turn you may place a shadow token next to Spike or Drusilla (3 tokens).", "Several cards get stronger near shadow tokens."], "Little Red": ["Her Basket starts in your discard pile and shows an item.", "Card effects marked with a symbol only happen if that symbol matches the item in her basket."], "Beowulf": ["Beowulf starts with 1 Rage (max 3) and gains 1 Rage whenever he takes damage.", "Some cards let you spend Rage for extra effects."], "Yennenga": ["When Yennenga would take damage, you may move any of it onto Archers in her zone (no more than each Archer's remaining health)."], "Sun Wukong": ["No Clones start on the board. At the start of your turn you may take 1 damage to summon a Clone next to Sun Wukong."], "Achilles": ["When Patroclus is defeated, discard 2 random cards.", "After that, Achilles' attacks get +2 and he draws 1 card whenever he wins a combat."], "King Arthur": ["When King Arthur attacks, you may BOOST the attack by playing a second card face down. If your attack card's effects are canceled, the boost is wasted."], "Alice": ["Choose whether Alice starts BIG or SMALL. BIG: +2 to her attack cards. SMALL: +1 to her defense cards.", "Some cards change her size."], "Sinbad": ["When you maneuver, your fighters may move +1 space for each VOYAGE card in your discard pile."], "Invisible Man": ["At the start of the game, place 3 fog tokens in separate spaces in his zone.", "On a fog space he adds +1 to his defense cards, and he can move between fog spaces as if they were adjacent."], "Sherlock Holmes": ["Your opponent cannot cancel effects on HOLMES or DR. WATSON cards (ANY cards can still be canceled)."], "Doctor Strange": ["Dark Pact: after each combat where he played a card, you may deal 1 damage to him to put that card on the bottom of your deck and draw 1."], "Deadpool": ["After you attack, Deadpool recovers 1 health.", "If your opponent's real name is Logan, all your attacks are +5. Some of his cards work on the honor system — the app will ask you."], "Buffy": ["Buffy may move through opposing fighters, including when moved by effects."], "Daredevil": ["During combat, if you have 2 or fewer cards in hand, you may BLIND BOOST (add the top card of your deck's BOOST, then discard it)."], "Ms. Marvel": ["At the start of your turn you may move her 1 space. She can attack from up to 2 spaces away (ignoring zones)."], "Bullseye": ["He can attack a fighter up to 5 spaces away, ignoring zones."], "Spider-Man": ["When Spider-Man is attacked, the attack card's printed value is shown to you before you choose a defense."], "She-Hulk": ["At the start of your turn, you may discard a card to deal damage equal to its BOOST to a fighter in her zone."]};
const QUICK_RULES_HTML="<h2>Quick rules</h2>\n<ul>\n<li><b>Goal:</b> defeat your opponent's hero. Sidekicks that drop to 0 just leave the board.</li>\n<li><b>Your turn:</b> take 2 actions (you can repeat one): <b>Maneuver</b>, <b>Scheme</b> or <b>Attack</b>. Then discard down to 7 cards.</li>\n<li><b>Maneuver:</b> draw 1 card, then move each of your fighters up to their move value. You may BOOST: discard a card to add its boost number to the movement. You can pass through your own fighters, not enemies.</li>\n<li><b>Scheme:</b> play a ⚡ scheme card and do what it says.</li>\n<li><b>Attack:</b> melee fighters hit adjacent enemies; ranged fighters hit adjacent enemies or anyone in a zone (colour) they share. Play an attack or versatile card face down; the defender may play a defense or versatile card. Both flip together.</li>\n<li><b>Combat order:</b> IMMEDIATELY effects → DURING COMBAT effects → damage (attack value minus defense value) → AFTER COMBAT effects (defender's first). The attacker wins if they dealt at least 1 combat damage.</li>\n<li><b>Feint-style cards</b> cancel the effects on the other card, not its value.</li>\n<li><b>Empty deck:</b> whenever you'd draw and can't, each of your fighters takes 2 damage.</li>\n<li><b>The app</b> handles card effects, damage and prompts — just follow the bar at the top when it asks you something.</li>\n</ul>";

function heroRulesHtml(d,seat){const r=heroRules(d);const nm=d.label||d.hero.name;return `<div class="hrules" style="--c:${themeOf(seat).color}"><h3>${esc(nm)}${seat?` <span class="muted small">· ${esc(seatName(seat))}</span>`:''}</h3><p class="small"><b>Ability:</b> ${esc(d.hero.ability)}</p>${r?`<ul>${r.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'<p class="muted small">No special rules beyond the ability.</p>'}</div>`;}

     <div class="sbtns"><button class="btn ghost" data-a="x_view" data-k="">Close</button></div></div></div>`;}

function renderSheet(){const sh=S.ui.sheet;if(!sh)return '';const me=viewSeat();const pr=S.priv[me];const c=pr.hand.find(x=>x.id===sh);if(!c)return '';
  const p=S.pub;const btns=[];const comb=p.combat;
  if(S.ui.mode==='handlimit')btns.push(['discard','Discard']);
  if(comb&&comb.defender===me&&!comb.defReady&&isDefCard(c)&&canUse(c,comb.defF))btns.push(['defend','Defend with this']);
  if(S.ui.mode==='maneuver'&&!Object.keys(S.ui.moved).length&&!S.ui.boostUsed&&!S.ui.hellCyc)btns.push(['boost',`Boost movement +${c.boost}`]);
  if(S.ui.mode==='attack'&&S.ui.atkT&&isAtkCard(c)&&canUse(c,S.ui.atkF)&&cardTargets(c,S.ui.atkF).has(S.ui.atkT))btns.push(['playatk','Attack with this (face down)']);
  if(S.ui.mode==='scheme'&&schemeOK(c,me))btns.push(['playscheme','Play this scheme']);
  const why=!btns.length&&!cardPlayable(c)?`<p class="muted small" style="text-align:center">${esc(c.fighter&&norm(c.fighter)!=='any'?'Only '+c.fighter+' can use this card.':'')}</p>`:'';
  if(showManual())btns.push(['reveal','Show to opponent'],['discard2','Discard (card effect)'],['topdeck','Put on top of deck']);btns.push(['close','Close']);
  return `<div class="sheet" data-a="close"><div class="sheetin cardsheet" style="--nb:${btns.length}">${cardHtml(c)}${why}
   <div class="sbtns">${btns.map(([a,l])=>`<button class="btn${a==='close'?' ghost':''}" data-a="s_${a}">${esc(l)}</button>`).join('')}</div></div></div>`;}
function renderPeek(){const k=S.ui.peek;if(!k)return '';const pile=S.pub.discard[k]||[];
  return `<div class="sheet" data-a="closepeek"><div class="sheetin"><h3>${esc(seatName(k))} discard pile (${pile.length})</h3>
  <div class="hand wrapgrid">${pile.slice().reverse().map(c=>cardHtml(c)).join('')||'<span class="muted">Empty</span>'}</div>
  ${k===viewSeat()?'<button class="btn" data-a="reshuffle">Shuffle discard into deck (card effect)</button>':''}<button class="btn ghost" data-a="closepeek">Close</button></div></div>`;}

// ---------- Events ----------
document.addEventListener('change',e=>{if(e.target.id==='bd'){const t=document.getElementById('bdjson');if(t)t.classList.toggle('hide',e.target.value!=='custom');}});
document.addEventListener('change',e=>{const t=e.target;if(!t.dataset||!t.dataset.th)return;const seat=t.dataset.s;S.ui.theme=S.ui.theme||{};S.ui.theme[seat]=S.ui.theme[seat]||{};
  if(t.dataset.th==='color'){S.ui.theme[seat].color=t.value;applyTheme(seat);return;}
  const f=t.files&&t.files[0];if(!f)return;const img=new Image();img.onload=()=>{
    S.ui.theme[seat][t.dataset.th]=t.dataset.th==='piece'?cutout(img):squareJpeg(img);URL.revokeObjectURL(img.src);applyTheme(seat);render();toast('Saved for this hero.');};
  img.onerror=()=>toast('Could not read that image.');img.src=URL.createObjectURL(f);});
function squareJpeg(img){const c=document.createElement('canvas');c.width=c.height=180;const g=c.getContext('2d');const sz=Math.min(img.width,img.height);
  g.drawImage(img,(img.width-sz)/2,(img.height-sz)/2,sz,sz,0,0,180,180);return c.toDataURL('image/jpeg',0.72);}
// Fit a figure photo into a tall canvas and knock out the background colour sampled from the corners.
function cutout(img){const H=300,W=Math.round(Math.min(260,H*img.width/img.height));const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');
  g.drawImage(img,0,0,W,H);const d=g.getImageData(0,0,W,H);const p=d.data;
  const corners=[[1,1],[W-2,1],[1,H-2],[W-2,H-2]].map(([x,y])=>{const i=(y*W+x)*4;return [p[i],p[i+1],p[i+2]];});
  const bg=[0,1,2].map(k=>corners.reduce((a,c)=>a+c[k],0)/4);
  const near=(i,t)=>Math.abs(p[i]-bg[0])+Math.abs(p[i+1]-bg[1])+Math.abs(p[i+2]-bg[2])<t;
  // flood fill from the edges so dark parts inside the figure survive
  const seen=new Uint8Array(W*H);const st=[];for(let x=0;x<W;x++){st.push(x,(H-1)*W+x);}for(let y=0;y<H;y++){st.push(y*W,y*W+W-1);}
  while(st.length){const q=st.pop();if(seen[q])continue;seen[q]=1;const i=q*4;if(!near(i,60))continue;p[i+3]=0;const x=q%W,y=(q/W)|0;
    if(x>0)st.push(q-1);if(x<W-1)st.push(q+1);if(y>0)st.push(q-W);if(y<H-1)st.push(q+W);}
  g.putImageData(d,0,0);return c.toDataURL('image/png');}

      then:(ids)=>{pubUpdate({trackers:{[seat]:{size:ids[0]}}});log(`${d.hero.name} starts the game ${ids[0].toUpperCase()}.`);}});runFx(null);return;}}
function driveCombat(){const c=S.pub&&S.pub.combat;if(!c)return;if(shieldPending())return;
  if(S.pub.status==='over'&&c.stage!=='done'){if(mySeats().includes(c.attacker))pubUpdate({combat:{stage:'done'}});return;}
  if(c.stage!=='after_def'&&c.stage!=='after_atk')return;
  const seat=c.stage==='after_def'?c.defender:c.attacker;if(!mySeats().includes(seat))return;
  const key=c.id+':'+c.stage;if(S.ui.stepKey===key)return;const flag=c.stage==='after_def'?'runD':'runA';if(c[flag])return;
  S.ui.stepKey=key;pubUpdate({combat:{[flag]:true}});
  setTimeout(()=>runAfter(seat,clone(S.pub.combat),()=>{S.ui.stepKey=null;advanceCombat(c.stage);}),0);}
function advanceCombat(stage){const c=S.pub.combat;if(!c||c.stage!==stage)return;
  pubUpdate({combat:{stage:stage==='after_def'?'after_atk':'done'}});setTimeout(reconcile,0);}

// ---------- context-aware hand ----------
function cardPlayable(c){const me=viewSeat();const p=S.pub;const comb=p.combat;if(S.ui.fx)return false;
  if(comb&&comb.defender===me&&!comb.defReady)return isDefCard(c)&&canUse(c,comb.defF);
  if(comb&&comb.attacker===me&&comb.stage==='choose'&&comb.atkCard&&combatCalc(comb).selfBoost&&!comb.nsBoost)return true;
  const m=S.ui.mode;
  if(m==='attack'){if(S.ui.atkF)return isAtkCard(c)&&canUse(c,S.ui.atkF);return attackersFor(me).some(f=>isAtkCard(c)&&canUse(c,f));}
  if(m==='scheme')return schemeOK(c,me);
  if(m==='maneuver')return !Object.keys(S.ui.moved).length&&!S.ui.boostUsed;
  if(m==='handlimit')return true;
  if(comb)return false;
  return true;}
function showManual(){return !!(S.ui.manual||(S.ui.fx&&S.ui.fx.kind==='manual'));}

// ===================== Drag a card from your hand to play it =====================
function pick3dAt(x,y){if(!G3.r||!document.getElementById('b3'))return null;const el=document.elementFromPoint(x,y);if(el!==G3.r.domElement)return null;
  const rect=G3.r.domElement.getBoundingClientRect();const v=new THREE.Vector2(((x-rect.left)/rect.width)*2-1,-((y-rect.top)/rect.height)*2+1);
  const ray=new THREE.Raycaster();ray.setFromCamera(v,G3.cam);const hits=ray.intersectObjects(G3.root.children,true);
  for(const h of hits){let q=h.object;let vis=true;for(let z=q;z;z=z.parent)if(!z.visible){vis=false;break;}if(!vis)continue;while(q&&!(q.userData&&(q.userData.f||q.userData.sp||q.userData.mat)))q=q.parent;if(q)return q.userData;}return null;}
function fighterAtPoint(x,y){const el=document.elementFromPoint(x,y);const f=el&&el.closest&&el.closest('[data-f]');if(f)return f.dataset.f;
  const u=pick3dAt(x,y);if(u){if(u.f)return u.f;if(u.sp)return fighterAt(u.sp);}return null;}
function overHand(y){const fh=fhPx();return y>window.innerHeight-fh+4;}
// Decide what dropping card c at (x,y) means. With run=true, do it.
function dragIntent(c,x,y,run){const me=viewSeat();const p=S.pub;const comb=p.combat;const t=p.turn;const no=m=>({ok:false,label:m});
  if(!c)return no('');if(S.ui.fx)return no('Finish the current effect first');
  if(comb&&comb.defender===me&&!comb.defReady){if(!isDefCard(c))return no('Only defense or versatile cards can defend');if(!canUse(c,comb.defF))return no(`${fighters()[comb.defF].name} can't use this card`);
    if(run){S.ui.sheet=c.id;onSheet('defend');}return {ok:true,label:`Defend with ${c.name}`};}
  if(S.ui.mode==='handlimit'){if(run){S.ui.sheet=c.id;onSheet('discard');}return {ok:true,label:`Discard ${c.name}`};}
  if(S.ui.mode==='maneuver'){if(Object.keys(S.ui.moved).length||S.ui.boostUsed)return no('Boost before moving anyone (one boost per maneuver)');if(run){S.ui.sheet=c.id;onSheet('boost');}return {ok:true,label:`Boost movement +${c.boost}`};}
  if(p.status!=='play'||t.seat!==me)return no("It's not your turn");if(comb)return no('Finish the combat first');if(t.actions<=0)return no('No actions left — end your turn');
  if(c.type==='scheme'){if(!schemeOK(c,me))return no(c.fighter&&norm(c.fighter)!=='any'?`Only ${c.fighter} can play this`:"You can't play this now");
    if(run){S.ui.mode='scheme';S.ui.sheet=c.id;onSheet('playscheme');}return {ok:true,label:`Play scheme: ${c.name}`};}
  if(isAtkCard(c)){
    if(S.ui.mode==='attack'&&S.ui.atkF&&S.ui.atkT){if(!canUse(c,S.ui.atkF))return no(`${fighters()[S.ui.atkF].name} can't use this card`);if(!cardTargets(c,S.ui.atkF).has(S.ui.atkT))return no('This attack can only target a fighter adjacent to '+fighters()[S.ui.atkF].name);if(run){S.ui.sheet=c.id;onSheet('playatk');}return {ok:true,label:`Attack ${fighters()[S.ui.atkT].name} with ${c.name}`};}
    const tgt0=fighterAtPoint(x,y);const tgt=tgt0&&fighters()[tgt0]&&fighters()[tgt0].seat!==me?tgt0:null;
    const atks=myLive(me).filter(f=>canUse(c,f)&&cardTargets(c,f).size&&(!tgt||cardTargets(c,f).has(tgt)));
    if(!atks.length)return no(tgt?`${fighters()[tgt].name} isn't in range of anyone who can use this`:'No fighter can attack with this card right now');
    if(tgt&&atks.length===1){if(run){Object.assign(S.ui,{mode:'attack',atkF:atks[0],atkT:tgt,pendCard:c.id});playPending();}return {ok:true,label:`${fighters()[atks[0]].name} attacks ${fighters()[tgt].name}`};}
    if(!tgt){const all=atks.flatMap(f=>[...cardTargets(c,f)].map(g=>[f,g]));if(all.length===1){if(run){Object.assign(S.ui,{mode:'attack',atkF:all[0][0],atkT:all[0][1],pendCard:c.id});playPending();}return {ok:true,label:`${fighters()[all[0][0]].name} attacks ${fighters()[all[0][1]].name}`};}}
    if(run){Object.assign(S.ui,{mode:'attack',atkF:atks.length===1?atks[0]:null,atkT:tgt,pendCard:c.id});render();}
    return {ok:true,label:tgt?`Attack ${fighters()[tgt].name} — then tap your attacker`:`Attack with ${c.name} — drop on an enemy, or choose next`};}
  return no(c.type==='defense'?'Defense cards are played when you are attacked':"You can't play this now");}
function playPending(){const id=S.ui.pendCard;S.ui.pendCard=null;const me=viewSeat();const c=handOf(me).find(x=>x.id===id);if(!c){render();return;}
  if(!canUse(c,S.ui.atkF)||!cardTargets(c,S.ui.atkF).has(S.ui.atkT)){toast("That attack isn't possible.");render();return;}S.ui.sheet=c.id;onSheet('playatk');}
const DR={};
document.addEventListener('pointerdown',e=>{const el=e.target.closest&&e.target.closest('.fan .cd[data-c]');if(!el||e.button>0)return;
  DR.id=el.dataset.c;DR.el=el;DR.x0=e.clientX;DR.y0=e.clientY;DR.on=false;DR.pid=e.pointerId;DR.swallow=false;},true);
document.addEventListener('pointermove',e=>{if(!DR.id||e.pointerId!==DR.pid)return;const dx=e.clientX-DR.x0,dy=e.clientY-DR.y0;
  if(!DR.on){if(Math.hypot(dx,dy)<12)return;DR.on=true;const c=handOf(viewSeat()).find(x=>x.id===DR.id);if(!c){DR.id=null;return;}DR.card=c;
    DR.g=document.createElement('div');DR.g.className='dragghost';DR.g.innerHTML=cardHtml(c);document.body.appendChild(DR.g);DR.l=document.createElement('div');DR.l.className='draglbl';document.body.appendChild(DR.l);DR.el.classList.add('lifted');}
  e.preventDefault();DR.g.style.left=e.clientX+'px';DR.g.style.top=e.clientY+'px';
  if(overHand(e.clientY)){DR.g.className='dragghost';DR.l.className='draglbl';DR.l.textContent='Drag up onto the table to play';}
  else{const it=dragIntent(DR.card,e.clientX,e.clientY,false);DR.g.className='dragghost '+(it.ok?'ok':'no');DR.l.className='draglbl'+(it.ok?'':' no');DR.l.textContent=(it.ok?'Release: ':'')+it.label;}
  const gh=DR.g.getBoundingClientRect();DR.l.style.left=e.clientX+'px';DR.l.style.top=Math.max(20,gh.top-6)+'px';},{passive:false});
function endDrag(e,cancel){if(!DR.id)return;const was=DR.on,c=DR.card;if(DR.g)DR.g.remove();if(DR.l)DR.l.remove();if(DR.el)DR.el.classList.remove('lifted');DR.id=null;DR.on=false;
  if(!was)return;DR.swallow=true;setTimeout(()=>{DR.swallow=false;},350);if(cancel||overHand(e.clientY))return;
  const it=dragIntent(c,e.clientX,e.clientY,false);if(!it.ok){toast(it.label);return;}try{dragIntent(c,e.clientX,e.clientY,true);}catch(err){console.error(err);toast(err.message||String(err));}}
document.addEventListener('pointerup',e=>{if(DR.id&&e.pointerId===DR.pid)endDrag(e,false);},true);
document.addEventListener('pointercancel',e=>{if(DR.id&&e.pointerId===DR.pid)endDrag(e,true);},true);
document.addEventListener('click',e=>{if(DR.swallow){DR.swallow=false;e.stopPropagation();e.preventDefault();}},true);

let _rt;window.addEventListener('resize',()=>{clearTimeout(_rt);_rt=setTimeout(()=>{if(S.pub&&S.pub.status!=='lobby'&&!document.querySelector('.sheet'))render();},200);});
initCaps();render();
</script></body></html>
